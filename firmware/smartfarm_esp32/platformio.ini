#include <Arduino.h>
#include <WiFi.h>
#include <ArduinoOTA.h>

[platformio]
default_envs = bottomshelf_ota

[env:base_ota]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; === micro-ROS 설정 ===
board_microros_distro = humble
board_microros_transport = wifi

lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio
    adafruit/Adafruit GFX Library@^1.11.11
    adafruit/Adafruit SSD1306@^2.5.10
    adafruit/Adafruit BusIO@^1.16.1
    adafruit/DHT sensor library@^1.4.6

; ===== USB로 처음 플래싱할 때 쓰는 환경 =====
[env:bootstrap_ota]
extends = env:base_ota
upload_protocol = esptool
upload_port = COM3

; ===== BOTTOM 선반 ESP32 (OTA) =====
[env:bottomshelf_ota]
extends = env:base_ota
upload_protocol = espota
upload_port = 192.168.1.78     ; 바텀 선반 보드 IP

build_flags =
  -DHOSTNAME=\"bottomshelf\"
  -DNS=\"smartfarm/bottom\"

; ===== MID 선반 ESP32 (OTA) =====
[env:midshelf_ota]
extends = env:base_ota
upload_protocol = espota
upload_port = 192.168.1.79     ; 미드 선반 보드 IP

; 이 보드 전용 설정
build_flags =
  -DHOSTNAME=\"midshelf\"
  -DNS=\"smartfarm/mid\"


; ===== TOP 선반 ESP32 (OTA) =====
[env:topshelf_ota]
extends = env:base_ota
upload_protocol = espota
upload_port = 192.168.1.80     ; 탑 선반 보드 IP

build_flags =
  -DHOSTNAME=\"topshelf\"
  -DNS=\"smartfarm/top\"
